apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    namespace 'com.github.axet.mover'

    defaultConfig {
        applicationId "com.github.axet.mover"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode   130
        versionName   "1.2.117"
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = variant.applicationId.contains('.') ? variant.applicationId.tokenize('.').last() : variant.applicationId
            outputFileName = "${appName}-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.github.axet:android-library:1.37.1'
    implementation 'com.google.android.material:material:1.12.0'
    
    // JSR-305 annotations for null-safety (compile-time only, used by dependencies)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}
